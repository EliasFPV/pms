name: Build SkyHorizon APK

on:
  push:
    branches:
      - claude/skyhorizon-android-app-3tufdn
      - main
    paths:
      - "SkyHorizon/**"
      - ".github/workflows/skyhorizon-android.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: assembleDebug
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: SkyHorizon

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Make the Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run the astronomy unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build the debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Report the APK location and size
        run: ls -lh app/build/outputs/apk/debug/

      - name: Upload app-debug.apk
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: SkyHorizon/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload unit test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: SkyHorizon/app/build/reports/tests/
          if-no-files-found: ignore
