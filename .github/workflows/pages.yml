name: Deploy Demo to GitHub Pages

# Veröffentlicht die statische Demo unter docs/ als GitHub Pages.
# In den Repo-Einstellungen einmalig: Settings → Pages → Source = "GitHub Actions".

on:
  push:
    branches:
      - claude/italian-pms-architecture-a39pqq
      - main
    paths:
      - "docs/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - id: deployment
        uses: actions/deploy-pages@v4
